<figure class="quote"><blockquote>"Nate is one of the most thoughtful, strategic, and impactful user researchers I've worked with. His work leading our UX scorecard initiative is a great example: what began as a research artifact became a unifying framework used across product teams to anchor decisions in real user needs. Product managers rely on him as a sounding board because he consistently brings conversations back to the core question: what are we trying to learn, what decisions will this inform, and how will this help users?"</blockquote><figcaption>FORMER MANAGER · DIRECTOR OF USER INSIGHTS, ITHAKA</figcaption></figure>
<figure class="quote"><blockquote>"I highly recommend him for any role in the game industry — he's a vital development partner and someone I truly wish we hadn't lost. Where Nate truly shines is in his partnership after the research is complete. He works directly with product and design to interpret findings, pressure-test action plans, and serve as a sounding board as ideas evolve."</blockquote><figcaption>CROSS-FUNCTIONAL PARTNER · DIRECTOR OF EXPERIENCE DESIGN, AAA GAME STUDIO</figcaption></figure>
<figure class="quote"><blockquote>"Nate's research goes beyond superficial insights and gets at deeper motivations, problems, and opportunities. I've gone back to slides from that deck many times in the months since the study concluded, and I expect I'll continue to do so for quite a while."</blockquote><figcaption>DESIGN PARTNER · PRINCIPAL GAME DESIGNER, AAA GAME STUDIO</figcaption></figure>
